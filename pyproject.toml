[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dymension"
version = "0.1.0"
description = "Projet Python Dymension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dymension = "dymension.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dymension"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
